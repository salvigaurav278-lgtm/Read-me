<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Real Pathshala AI</title>
    <style>
      html,body{height:100%;margin:0;background:#4F46E5;color:#fff;font-family:system-ui,sans-serif}
      .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
      .spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
      @keyframes s{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- Fallback shown only if the remote server is unreachable. The WebView
         normally loads the hosted Next.js app via capacitor.config server.url. -->
    <div class="wrap">
      <div class="spin"></div>
      <p>Loading Real Pathshala AI…</p>
    </div>
  </body>
</html>
